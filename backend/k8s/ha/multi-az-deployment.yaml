apiVersion: apps/v1
kind: Deployment
metadata:
  name: voudemoto-backend-multi-az
  namespace: voudemoto
  labels:
    app: backend
    version: v1
spec:
  replicas: 6 # 2 réplicas por AZ (3 AZs)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0 # Zero downtime
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      # Service Account
      serviceAccountName: voudemoto-backend
      
      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      # Topology Spread Constraints - Distribui pods entre AZs
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      
      # Affinity - Preferência por distribuir entre nós diferentes
      affinity:
        podAntiAffinity:
          # Obrigatório: não colocar mais de 1 pod por nó
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - backend
              topologyKey: kubernetes.io/hostname
          
          # Preferencial: distribuir entre zonas diferentes
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - backend
                topologyKey: topology.kubernetes.io/zone
      
      # Init Containers
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "Waiting for database..."
                sleep 2
              done
              echo "Database is ready!"
        
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready!"
      
      containers:
        - name: backend
          image: ghcr.io/voudemoto/backend:latest
          imagePullPolicy: Always
          
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            
            # Database URLs (com failover)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: voudemoto-secrets
                  key: database-url
            - name: DATABASE_REPLICA_URL
              valueFrom:
                secretKeyRef:
                  name: voudemoto-secrets
                  key: database-replica-url
            
            # Redis (com Sentinel)
            - name: REDIS_SENTINEL_HOSTS
              value: "redis-sentinel-0.redis-sentinel:26379,redis-sentinel-1.redis-sentinel:26379,redis-sentinel-2.redis-sentinel:26379"
            - name: REDIS_MASTER_NAME
              value: "mymaster"
            
            # MongoDB (Replica Set)
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: voudemoto-secrets
                  key: mongodb-url
            
            # JWT Secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: voudemoto-secrets
                  key: jwt-secret
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: voudemoto-secrets
                  key: jwt-refresh-secret
            
            # Pod Info
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          
          # Resources
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          
          # Liveness Probe - Verifica se app está vivo
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
              httpHeaders:
                - name: X-Health-Check
                  value: liveness
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          
          # Readiness Probe - Verifica se app está pronto para tráfego
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
              httpHeaders:
                - name: X-Health-Check
                  value: readiness
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          
          # Startup Probe - Permite tempo de inicialização
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          
          # Lifecycle Hooks
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    # Graceful shutdown
                    echo "Received SIGTERM, waiting for connections to drain..."
                    sleep 15
                    echo "Shutting down..."
          
          # Security Context
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
      
      # Termination Grace Period
      terminationGracePeriodSeconds: 30
      
      # DNS Policy
      dnsPolicy: ClusterFirst
      
      # Restart Policy
      restartPolicy: Always
---
# PodDisruptionBudget - Garante disponibilidade durante atualizações
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voudemoto-backend-pdb
  namespace: voudemoto
spec:
  minAvailable: 3 # Sempre manter pelo menos 3 pods rodando
  selector:
    matchLabels:
      app: backend
---
# Horizontal Pod Autoscaler - Scale baseado em métricas
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voudemoto-backend-hpa-multi-az
  namespace: voudemoto
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voudemoto-backend-multi-az
  minReplicas: 6
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Min
