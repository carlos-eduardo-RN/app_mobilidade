name: Database Migrations

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations'
        required: true
        type: choice
        options:
          - staging
          - production
      direction:
        description: 'Migration direction'
        required: true
        type: choice
        options:
          - up
          - down
      steps:
        description: 'Number of migrations (for down only)'
        required: false
        default: '1'

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get database credentials from Secrets Manager
        id: db-secrets
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id voudemoto/${{ github.event.inputs.environment }}/database --query SecretString --output text)
          echo "::add-mask::$SECRET"
          echo "DATABASE_URL=$(echo $SECRET | jq -r .url)" >> $GITHUB_OUTPUT

      - name: Run migrations (up)
        if: github.event.inputs.direction == 'up'
        env:
          DATABASE_URL: ${{ steps.db-secrets.outputs.DATABASE_URL }}
        run: |
          npm run migrate:up
          echo "✅ Migrations applied successfully"

      - name: Run migrations (down)
        if: github.event.inputs.direction == 'down'
        env:
          DATABASE_URL: ${{ steps.db-secrets.outputs.DATABASE_URL }}
        run: |
          npm run migrate:down -- --steps=${{ github.event.inputs.steps }}
          echo "✅ Migrations rolled back successfully"

      - name: Verify database schema
        env:
          DATABASE_URL: ${{ steps.db-secrets.outputs.DATABASE_URL }}
        run: |
          npm run migrate:status

      - name: Notify on Slack
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Database migration ${{ github.event.inputs.direction }} completed on ${{ github.event.inputs.environment }}
            Status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
