apiVersion: v1
kind: Secret
metadata:
  name: {{ include "voudemoto-backend.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voudemoto-backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | required "secrets.databaseUrl is required" | quote }}
  redis-url: {{ .Values.secrets.redisUrl | required "secrets.redisUrl is required" | quote }}
  mongodb-url: {{ .Values.secrets.mongodbUrl | required "secrets.mongodbUrl is required" | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | required "secrets.jwtSecret is required" | quote }}
  jwt-refresh-secret: {{ .Values.secrets.jwtRefreshSecret | required "secrets.jwtRefreshSecret is required" | quote }}
