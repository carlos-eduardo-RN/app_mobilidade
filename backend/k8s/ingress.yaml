apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voudemoto-ingress
  namespace: voudemoto
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.voudemoto.com"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  tls:
  - hosts:
    - api.voudemoto.com
    secretName: voudemoto-tls
  rules:
  - host: api.voudemoto.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voudemoto-backend
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: voudemoto-config
  namespace: voudemoto
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  API_VERSION: "v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: voudemoto-secrets
  namespace: voudemoto
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/voudemoto"
  redis-url: "redis://:password@redis:6379"
  mongodb-url: "mongodb://admin:password@mongodb:27017/voudemoto"
  jwt-secret: "your-jwt-secret-min-32-chars"
  jwt-refresh-secret: "your-refresh-secret-min-32-chars"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voudemoto-backend
  namespace: voudemoto
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: voudemoto-backend-role
  namespace: voudemoto
rules:
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: voudemoto-backend-rolebinding
  namespace: voudemoto
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: voudemoto-backend-role
subjects:
- kind: ServiceAccount
  name: voudemoto-backend
  namespace: voudemoto
